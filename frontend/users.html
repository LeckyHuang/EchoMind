<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - EchoMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <div class="loading-overlay" id="loading">
    <div class="loading-page">
      <div class="loading-spinner"></div>
      <span class="loading-text">加载中...</span>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="layout.js"></script>
  <script>
    let users = [];

    function initPage() {
      // 非管理员拦截
      const user = getCurrentUser();
      if (!user || user.role !== 'admin') {
        showToast('无权访问：需要管理员权限', 'error');
        window.location.href = 'dashboard.html';
        return;
      }

      const main = document.getElementById('main-content');
      if (!main) return;

      main.innerHTML = `
        <div class="page-header">
          <h1 class="page-title">用户管理</h1>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="showAddDialog()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              添加用户
            </button>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <table class="table">
              <thead>
                <tr>
                  <th>用户名</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>创建时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="users-tbody">
                <tr><td colspan="5" style="text-align: center; color: var(--muted);">加载中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 添加用户 Modal -->
        <div id="add-user-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;align-items:center;justify-content:center;">
          <div style="background:#fff;border-radius:12px;padding:24px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.15);">
            <h3 style="margin:0 0 16px;font-size:18px;">添加用户</h3>
            <div style="margin-bottom:12px;">
              <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">用户名 *</label>
              <input type="text" id="add-username" class="form-input" placeholder="请输入用户名" style="width:100%;">
            </div>
            <div style="margin-bottom:12px;">
              <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">初始密码 *</label>
              <input type="text" id="add-password" class="form-input" placeholder="请输入初始密码" style="width:100%;">
            </div>
            <div style="margin-bottom:12px;">
              <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">邮箱</label>
              <input type="text" id="add-email" class="form-input" placeholder="可选" style="width:100%;">
            </div>
            <div style="margin-bottom:20px;">
              <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">角色</label>
              <select id="add-role" class="form-input" style="width:100%;">
                <option value="user">普通用户</option>
                <option value="admin">管理员</option>
              </select>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px;">
              <button class="btn btn-ghost" onclick="closeAddDialog()">取消</button>
              <button class="btn btn-primary" onclick="submitAddUser()">创建</button>
            </div>
          </div>
        </div>
      `;

      loadUsers();
    }

    async function loadUsers() {
      try {
        const data = await getUsers();
        users = data.users || [];
        renderUsers();
      } catch (e) {
        console.error('加载用户失败:', e);
        showToast('加载用户失败: ' + e.message, 'error');
        document.getElementById('users-tbody').innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--muted);">加载失败</td></tr>';
      }
    }

    function renderUsers() {
      const tbody = document.getElementById('users-tbody');
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--muted);">暂无数据</td></tr>';
        return;
      }
      tbody.innerHTML = users.map(u => `
        <tr>
          <td>${escapeHtml(u.username || '未知')}</td>
          <td>${u.role === 'admin' ? '管理员' : '普通用户'}</td>
          <td>${u.is_active ? '<span class="badge badge-success">活跃</span>' : '<span class="badge badge-muted">禁用</span>'}</td>
          <td style="font-family: var(--font-mono); font-size: 0.85rem;">${formatDate(u.created_at)}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick="resetPassword(${u.id}, '${escapeHtml(u.username || '')}')">重置密码</button>
            <button class="btn btn-ghost btn-sm" onclick="toggleStatus(${u.id}, ${u.is_active})">${u.is_active ? '禁用' : '启用'}</button>
            <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="deleteUser(${u.id})">删除</button>
          </td>
        </tr>
      `).join('');
    }

    function showAddDialog() {
      document.getElementById('add-user-modal').style.display = 'flex';
      document.getElementById('add-username').value = '';
      document.getElementById('add-password').value = '';
      document.getElementById('add-email').value = '';
      document.getElementById('add-role').value = 'user';
    }

    function closeAddDialog() {
      document.getElementById('add-user-modal').style.display = 'none';
    }

    async function submitAddUser() {
      const username = document.getElementById('add-username').value.trim();
      const password = document.getElementById('add-password').value.trim();
      const email = document.getElementById('add-email').value.trim() || null;
      const role = document.getElementById('add-role').value;

      if (!username || !password) {
        showToast('用户名和密码不能为空', 'warning');
        return;
      }

      try {
        await createUser({ username, password, email, role });
        showToast('用户创建成功', 'success');
        closeAddDialog();
        loadUsers();
      } catch (e) {
        showToast('创建失败: ' + e.message, 'error');
      }
    }

    async function resetPassword(id, username) {
      if (!confirm('确定要重置用户「' + username + '」的密码吗？')) return;
      try {
        const result = await resetUserPassword(id);
        showToast('密码已重置为：' + (result.password || 'User123456'), 'success');
      } catch (e) {
        showToast('重置失败: ' + e.message, 'error');
      }
    }

    async function toggleStatus(id, currentActive) {
      const action = currentActive ? '禁用' : '启用';
      if (!confirm('确定要' + action + '该用户吗？')) return;
      try {
        await toggleUserStatus(id, !currentActive);
        showToast('已' + action, 'success');
        loadUsers();
      } catch (e) {
        showToast('操作失败: ' + e.message, 'error');
      }
    }

    async function deleteUser(id) {
      if (!confirm('确定要删除该用户吗？此操作不可恢复。')) return;
      try {
        await deleteUserApi(id);
        showToast('用户已删除', 'success');
        loadUsers();
      } catch (e) {
        showToast('删除失败: ' + e.message, 'error');
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      return new Date(dateStr).toLocaleString('zh-CN');
    }

    function escapeHtml(text) {
      if (text == null) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.waitForLayout(initPage);
  </script>
</body>
</html>
